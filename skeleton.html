<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UNIVLOP - Skeleton Loading Page</title>

  <!-- Luxury Editorial Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #FDFBF7;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: var(--font-body);
    }
    .skeleton-demo-toolbar {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111111;
      color: #FFFFFF;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      z-index: 100000;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .skeleton-demo-btn {
      background: #550E15;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .skeleton-demo-btn:hover {
      background: #7a1520;
    }
  </style>
</head>

<body>

  <!-- Floating Demo Toolbar -->
  <div class="skeleton-demo-toolbar">
    <span>UNIVLOP SKELETON SCREEN</span>
    <a href="index.html" class="skeleton-demo-btn">
      <span>Buka Web Utama</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>
  </div>

  <!-- Announcement Skeleton -->
  <div class="sk-announcement">
    <div class="sk-box" style="width: 50%; max-width: 580px; height: 11px;"></div>
  </div>

  <!-- Desktop Navbar Skeleton -->
  <div class="sk-navbar">
    <div class="sk-nav-inner">
      <div class="sk-box" style="width: 140px; height: 32px;"></div>
      <div class="sk-nav-links">
        <div class="sk-box" style="width: 80px; height: 16px;"></div>
        <div class="sk-box" style="width: 110px; height: 16px;"></div>
        <div class="sk-box" style="width: 130px; height: 16px;"></div>
      </div>

        <div class="sk-box" style="width: 110px; height: 36px;"></div>
        <div class="sk-box" style="width: 110px; height: 36px;"></div>
      </div>
    </div>
  </div>

  <!-- Hero Skeleton Split -->
  <div class="sk-hero-split">
    <div class="sk-hero-col-left">
      <div class="sk-box" style="width: 180px; height: 20px; margin-bottom: 24px;"></div>
      <div class="sk-box" style="width: 80%; height: 36px; margin-bottom: 12px;"></div>
      <div class="sk-box" style="width: 50%; height: 20px; margin-bottom: 28px;"></div>
      <div class="sk-hero-img-box sk-box"></div>
    </div>
    <div class="sk-hero-col-right">
      <div class="sk-box" style="width: 190px; height: 22px; margin-bottom: 20px;"></div>
      <div class="sk-box" style="width: 90%; height: 40px; margin-bottom: 12px;"></div>
      <div class="sk-box" style="width: 75%; height: 40px; margin-bottom: 24px;"></div>
      <div class="sk-box" style="width: 100%; height: 15px; margin-bottom: 8px;"></div>
      <div class="sk-box" style="width: 95%; height: 15px; margin-bottom: 8px;"></div>
      <div class="sk-box" style="width: 65%; height: 15px; margin-bottom: 30px;"></div>
      <div style="display: flex; gap: 12px;">
        <div class="sk-box" style="width: 180px; height: 46px;"></div>
        <div class="sk-box" style="width: 160px; height: 46px;"></div>
      </div>
    </div>
  </div>

  <!-- Category Pills Skeleton -->
  <div class="sk-categories-strip">
    <div class="sk-box" style="width: 110px; height: 36px; flex-shrink: 0;"></div>
    <div class="sk-box" style="width: 130px; height: 36px; flex-shrink: 0;"></div>
    <div class="sk-box" style="width: 115px; height: 36px; flex-shrink: 0;"></div>
    <div class="sk-box" style="width: 125px; height: 36px; flex-shrink: 0;"></div>
    <div class="sk-box" style="width: 145px; height: 36px; flex-shrink: 0;"></div>
    <div class="sk-box" style="width: 120px; height: 36px; flex-shrink: 0;"></div>
  </div>

  <!-- Product Grid Skeleton -->
  <div class="sk-products-container">
    <div class="sk-products-header">
      <div class="sk-box" style="width: 220px; height: 24px;"></div>
      <div class="sk-box" style="width: 130px; height: 16px;"></div>
    </div>
    <div class="sk-products-grid">
      <div class="sk-card">
        <div class="sk-card-media sk-box"></div>
        <div class="sk-card-body">
          <div class="sk-box" style="width: 50%; height: 11px; margin-bottom: 8px;"></div>
          <div class="sk-box" style="width: 85%; height: 18px; margin-bottom: 12px;"></div>
          <div class="sk-box" style="width: 40%; height: 18px; margin-bottom: 16px;"></div>
          <div style="display: flex; gap: 8px;">
            <div class="sk-box" style="flex: 1; height: 38px;"></div>
            <div class="sk-box" style="flex: 1; height: 38px;"></div>
          </div>
        </div>
      </div>
      <div class="sk-card">
        <div class="sk-card-media sk-box"></div>
        <div class="sk-card-body">
          <div class="sk-box" style="width: 50%; height: 11px; margin-bottom: 8px;"></div>
          <div class="sk-box" style="width: 85%; height: 18px; margin-bottom: 12px;"></div>
          <div class="sk-box" style="width: 40%; height: 18px; margin-bottom: 16px;"></div>
          <div style="display: flex; gap: 8px;">
            <div class="sk-box" style="flex: 1; height: 38px;"></div>
            <div class="sk-box" style="flex: 1; height: 38px;"></div>
          </div>
        </div>
      </div>
      <div class="sk-card">
        <div class="sk-card-media sk-box"></div>
        <div class="sk-card-body">
          <div class="sk-box" style="width: 50%; height: 11px; margin-bottom: 8px;"></div>
          <div class="sk-box" style="width: 85%; height: 18px; margin-bottom: 12px;"></div>
          <div class="sk-box" style="width: 40%; height: 18px; margin-bottom: 16px;"></div>
          <div style="display: flex; gap: 8px;">
            <div class="sk-box" style="flex: 1; height: 38px;"></div>
            <div class="sk-box" style="flex: 1; height: 38px;"></div>
          </div>
        </div>
      </div>
      <div class="sk-card">
        <div class="sk-card-media sk-box"></div>
        <div class="sk-card-body">
          <div class="sk-box" style="width: 50%; height: 11px; margin-bottom: 8px;"></div>
          <div class="sk-box" style="width: 85%; height: 18px; margin-bottom: 12px;"></div>
          <div class="sk-box" style="width: 40%; height: 18px; margin-bottom: 16px;"></div>
          <div style="display: flex; gap: 8px;">
            <div class="sk-box" style="flex: 1; height: 38px;"></div>
            <div class="sk-box" style="flex: 1; height: 38px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
