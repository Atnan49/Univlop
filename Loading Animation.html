<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading Animation</title>
<style>
:root{--bg:#8b1a22;box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.stage{position:relative;width:min(58vw,250px)}
svg{width:100%;height:auto;display:block;overflow:visible}
.w{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.b{fill:none;stroke:var(--bg);stroke-linecap:round;stroke-linejoin:round}
/* gambar garis sekali di awal */
.draw{stroke-dasharray:100 101;stroke-dashoffset:100;animation:draw 1s cubic-bezier(.5,0,.2,1) forwards,vis .01s both}
.d2{animation-delay:.35s,.35s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes vis{from{opacity:0}to{opacity:1}}
/* tas & isi memantul */
.all{transform-box:fill-box;transform-origin:50% 100%;animation:hop 2.4s ease-in-out 2.8s infinite}
@keyframes hop{0%,100%{transform:none}10%{transform:scale(1.04,.95)}42%{transform:translateY(-12px) scale(.98,1.025)}75%{transform:scale(1.03,.96)}88%{transform:none}}
/* aliran energi di dalam tabung = simbol daur ulang */
.run{stroke-dasharray:15 200;stroke-dashoffset:15;opacity:0;animation:flow 2.4s cubic-bezier(.45,.05,.55,.95) 2.4s infinite}
@keyframes flow{0%{stroke-dashoffset:15;opacity:0}6%{opacity:1}90%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}
.rv{stroke-dasharray:100 101;stroke-dashoffset:100;animation:draw 1.1s cubic-bezier(.55,0,.3,1) .5s forwards,vis .01s .5s both}
.head{transform-box:fill-box;transform-origin:50% 40%;animation:headIn .45s cubic-bezier(.3,1.8,.5,1) 1.5s both,nudge 2.4s ease-in-out 2.8s infinite}
@keyframes headIn{from{transform:scale(0)}to{transform:none}}
@keyframes nudge{0%,80%,100%{transform:none}92%{transform:scale(1.1) translateY(3px)}}
/* wajah */
.face{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:faceIn .7s cubic-bezier(.3,1.7,.5,1) 1.95s forwards}
.wob{transform-box:fill-box;transform-origin:50% 50%;animation:wob 2.4s ease-in-out 2s infinite}
@keyframes faceIn{to{transform:scale(1)}}
@keyframes wob{0%,100%{transform:none}50%{transform:scale(1.02,.99)}}
.feat{animation:look 5s ease-in-out 2.4s infinite}
@keyframes look{0%,100%{transform:translate(0,0)}30%{transform:translate(-3px,1px)}65%{transform:translate(3px,-1px)}}
.eye{fill:var(--bg);transform-box:fill-box;transform-origin:50% 50%;animation:blink 3.6s 2.4s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.wink{fill:none;stroke:var(--bg);stroke-width:6;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:wk 3.6s 2.4s infinite}
@keyframes wk{0%,60%,100%{transform:none}68%{transform:scale(1.15,1.5)}76%{transform:none}}
.mouth{fill:none;stroke:var(--bg);stroke-width:6;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 0;animation:sm 2.4s ease-in-out 2s infinite}
@keyframes sm{50%{transform:scale(1.15,1.35)}}
.shadow{position:absolute;left:14%;right:14%;bottom:-5%;height:12px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(5px);opacity:0;animation:shin .5s 1s forwards,sh 2.4s ease-in-out 2.8s infinite}
@keyframes shin{to{opacity:.5}}
@keyframes sh{0%,100%{transform:scale(1);opacity:.5}42%{transform:scale(.7);opacity:.25}}
.t{font-size:13px;font-weight:600;letter-spacing:.2em;opacity:.9}
.t span span{animation:dt 1.2s infinite;opacity:.2}
.t span span:nth-child(2){animation-delay:.2s}.t span span:nth-child(3){animation-delay:.4s}
@keyframes dt{40%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:8s!important}}
</style></head>
<body>
<div class="stage">
<div class="shadow"></div>
<svg viewBox="95 30 320 375" role="img" aria-label="Memuat">
 <g class="all">
  <!-- tas -->
  <path class="w draw" pathLength="100" stroke-width="10" d="M124 148H380L398 366Q400 388 378 388H128Q106 388 108 366Z"/>
  <!-- tabung panah daur ulang (outline) -->
  <mask id="rvm" maskUnits="userSpaceOnUse" x="90" y="30" width="330" height="375"><path class="rv" pathLength="100" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" d="M167 243V290A83 83 0 0 0 333 290V145A83 83 0 0 0 167 145V168"/></mask>
  <g mask="url(#rvm)">
   <path class="w" stroke-width="40" d="M167 243V290A83 83 0 0 0 333 290V145A83 83 0 0 0 167 145V168"/>
   <path class="b" stroke-width="20" d="M167 243V290A83 83 0 0 0 333 290V145A83 83 0 0 0 167 145V168"/>
  </g>
  <!-- aliran di dalam tabung -->
  <path class="w run" pathLength="100" stroke-width="12" d="M167 243V290A83 83 0 0 0 333 290V145A83 83 0 0 0 167 145V168"/>
  <!-- kepala panah -->
  <g class="head">
   <polygon fill="var(--bg)" points="141,163 205,163 173,211"/>
   <path class="w" stroke-width="10" d="M152 163H141L173 211L205 163H182"/>
  </g>
  <!-- wajah -->
  <g class="face"><g class="wob">
   <rect x="190" y="180" width="120" height="170" rx="60" fill="#fff"/>
   <g transform="translate(-3 0)"><g class="feat">
    <circle class="eye" cx="227" cy="252" r="9.5"/>
    <path class="wink" d="M267 259Q278 242 290 257"/>
    <path class="mouth" d="M236 282Q252 298 268 282"/>
   </g></g>
  </g></g>
 </g>
</svg>
</div>
<div class="t"><span>MEMUAT<span>.</span><span>.</span><span>.</span></span></div>
</body></html>
